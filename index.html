<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Requester</title>
    <meta name="description"
        content="Recherchez et explorez des animes par titre, identifiant, classement ou catégorie.">
    <link rel="stylesheet" href="style.css">
    
    
</head>

<body>
    <header>
        <h1>ANIME REQUESTER</h1>
    </header>

    <main>

        <section id="api-key-section">
            <h2>Configuration de l'API</h2>
            <form id="api-form">
                <label for="api-key">Votre clé API RapidAPI :</label>
                <input type="password" id="api-key" required placeholder="Saisissez votre clé">
                <button type="submit">Enregistrer la clé</button>
            </form>
        </section>

        <section id="search-section" style="display: none;">
            <h2>Recherche d'Anime</h2>
            <form id="search-form">
                
                <div>
                    <label for="search-type">Choisissez un type de recherche :</label>
                    <select id="search-type" name="sortBy">
                        <option value="title">Recherche par titre</option>
                        <option value="id">Recherche par identifiant</option>
                        <option value="ranking">Recherche par classement</option>
                    </select>
                </div>

                <div>
                    <label for="search-param">Paramètre :</label>
                    <input type="text" id="search-param" name="search" required placeholder="Ex: evangelion">
                </div>
                <fieldset>
                    <legend>Genres (Optionnel) :</legend>
                    <label><input type="checkbox" name="genre" value="Action"> Action</label>
                    <label><input type="checkbox" name="genre" value="Comedy"> Comédie</label>
                    <label><input type="checkbox" name="genre" value="Drama"> Drame</label>
                    <label><input type="checkbox" name="genre" value="Adventure"> Aventure</label>
                    <label><input type="checkbox" name="genre" value="Fantasy"> Fantastique</label>
                    <label><input type="checkbox" name="genre" value="Sci-Fi"> Science-Fiction</label>
                    <label><input type="checkbox" name="genre" value="Romance"> Romance</label>
                    <label><input type="checkbox" name="genre" value="Slice of Life"> Tranche de vie</label>

                </fieldset>

                <div>
                    <button type="submit">Rechercher</button>
                    <button type="reset">Effacer</button>
                </div>

            </form>
        </section>

        <section id="results-container"></section>
    </main>

    <template id="anime-card-template">
        <div class="anime-card">
            <div class="anime-card-header">
                <img class="anime-card-image" src="" alt="Image de l'anime">
                <h3 class="anime-card-title"></h3>
            </div>
            <div class="anime-card-body">
                <p class="anime-card-synopsis"></p>
                <p class="anime-card-info"></p>
                <p class="anime-card-genres"></p>
                <p class="anime-card-ranking"></p>
                <p class="anime-card-nb-episodes"></p>
            </div>
        </div>
    </template>

    <script type="module" src="./javascript/main.js"></script>
</body>

</html>
