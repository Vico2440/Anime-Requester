<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Requester</title>
    <meta name="description"
        content="Recherchez et explorez des animes par titre, identifiant, classement ou catégorie.">
        
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cherry+Bomb+One&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
</head>

<body>
    <header>
        <h1 id="site-title" class="text-center">ANIME REQUESTER</h1>
    </header>

    <main>
        <div class="container">

        <section id="api-key-section">
            <h2>Configuration de l'API</h2>
            <form id="api-form">
                <label for="api-key">Votre clé API RapidAPI :</label>
                <input type="password" id="api-key" required placeholder="Saisissez votre clé">
                <button type="submit">Enregistrer la clé</button>
            </form>
        </section>

        </div>

        <section id="search-section" style="display: none;" class="card border border-2 border-dark rounded-3 p-4 shadow-sm my-4 col-12 col-md-10 col-lg-8 mx-auto">
            <h2 class="text-center mb-4">Recherche d'Anime</h2>
            <form id="search-form" class="col-12 col-md-10 mx-auto">

                <div class="row mb-3 align-items-center justify-content-center">
                    <label for="search-type" class="col-12 col-sm-5 col-form-label text-sm-end fw-semibold">Type de recherche :</label>
                    <div class="col-12 col-sm-7">
                        <select id="search-type" name="sortBy" class="form-select">
                            <option value="title">Recherche par titre</option>
                            <option value="id">Recherche par identifiant</option>
                            <option value="ranking">Recherche par classement</option>
                        </select>
                    </div>
                </div>

                <div class="row mb-3 align-items-center justify-content-center">
                    <label for="search-param" class="col-12 col-sm-5 col-form-label text-sm-end fw-semibold">Paramètre :</label>
                    <div class="col-12 col-sm-7">
                        <input type="text" id="search-param" name="search" class="form-control" required placeholder="Ex: evangelion">
                    </div>
                </div>

                <fieldset class="mb-4 text-center">
                    <legend class="col-form-label pt-0 fs-6 fw-bold mb-2">Genres (Optionnel) :</legend>
                    <div class="d-flex flex-wrap gap-3 justify-content-center">
                        <label class="form-check-label"><input type="checkbox" name="genre" value="Action" class="form-check-input me-1"> Action</label>
                        <label class="form-check-label"><input type="checkbox" name="genre" value="Comedy" class="form-check-input me-1"> Comédie</label>
                        <label class="form-check-label"><input type="checkbox" name="genre" value="Drama" class="form-check-input me-1"> Drame</label>
                        <label class="form-check-label"><input type="checkbox" name="genre" value="Adventure" class="form-check-input me-1"> Aventure</label>
                        <label class="form-check-label"><input type="checkbox" name="genre" value="Fantasy" class="form-check-input me-1"> Fantastique</label>
                        <label class="form-check-label"><input type="checkbox" name="genre" value="Sci-Fi" class="form-check-input me-1"> Science-Fiction</label>
                        <label class="form-check-label"><input type="checkbox" name="genre" value="Romance" class="form-check-input me-1"> Romance</label>
                        <label class="form-check-label"><input type="checkbox" name="genre" value="Slice of Life" class="form-check-input me-1"> Slice of life</label>
                    </div>
                </fieldset>

                <div class="d-flex justify-content-center gap-2">
                    <button type="submit" class="btn btn-primary px-4">Rechercher</button>
                    <button type="reset" class="btn btn-outline-secondary px-4">Effacer</button>
                </div>

            </form>
        </section>
        </div>

        <section id="results-container" class="container">

            <div class="row">

                

            </div>

        </section>

        </div>
    </main>

    <template id="anime-card-template">
        <div class="anime-card">
            <div class="anime-card-header">
                <img class="anime-card-image" src="" alt="Image de l'anime">
                <h3 class="anime-card-title"></h3>
            </div>
            <div class="anime-card-body">
                <p class="anime-card-synopsis"></p>
                <p class="anime-card-info"></p>
                <p class="anime-card-genres"></p>
                <p class="anime-card-ranking"></p>
                <p class="anime-card-nb-episodes"></p>
            </div>
        </div>
    </template>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script type="module" src="./javascript/main.js"></script>
</body>

</html>
